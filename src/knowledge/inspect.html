<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspeção da base jurídica</title>
<style>
:root{color-scheme:light;--ink:#183239;--muted:#526c73;--line:#d3e0df;--accent:#087466}*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:var(--ink);font:16px/1.55 system-ui,sans-serif}header{background:#113e3b;color:#fff;padding:30px max(24px,calc((100vw - 1240px)/2))}header p{margin:5px 0;color:#cae5df}h1{font-size:30px;margin:0}main{max-width:1288px;padding:24px;margin:auto}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 22px}.stats div{background:white;border:1px solid var(--line);border-radius:10px;padding:12px 22px}.stats b{display:block;font-size:26px}.notice{background:#fff7e6;border:1px solid #e5d4af;padding:14px 18px;border-radius:8px;margin-bottom:20px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}input,select,button{font:inherit;padding:10px 14px;border:1px solid #9cb8b3;border-radius:7px;background:white;color:var(--ink)}input{flex:1;min-width:230px}button{cursor:pointer}button[aria-pressed=true]{background:var(--accent);color:#fff}nav{display:flex;gap:8px;flex-wrap:wrap}article{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin-bottom:12px}h2{font-size:18px;margin:0 0 5px}small,.muted{color:var(--muted)}.tag{background:#e6f2ee;color:#146258;border-radius:4px;padding:2px 7px;font-size:13px;margin-right:6px}.text{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.meta{font:12px/1.5 ui-monospace,monospace;overflow-wrap:anywhere;white-space:pre-wrap}a{color:#086f67;overflow-wrap:anywhere}details{border-top:1px solid var(--line);margin-top:12px;padding-top:9px}summary{cursor:pointer;font-weight:600}.pagination{display:flex;align-items:center;gap:14px;margin:18px 0}footer{font-size:13px;color:var(--muted);padding:20px 0}.empty{padding:35px;text-align:center}.source-title{font-size:14px;color:var(--muted)}@media(max-width:600px){header{padding:22px}main{padding:16px}article{padding:16px}h1{font-size:25px}}
</style>
<header><p>REFERÊNCIAS · CONSULTA LOCAL</p><h1>Base jurídica</h1><p id="identity"></p></header>
<main><div class="stats" id="stats"></div><div class="notice">Esta tela mostra registros exportados do SQLite, sem editar o banco. Cobertura de IDs e presença de documentos não equivalem à suficiência jurídica. Lacunas ficam visíveis e não provocam revisão automática.</div>
<nav><button data-view="chunks" aria-pressed="true">Trechos</button><button data-view="sources" aria-pressed="false">Fontes</button><button data-view="questions" aria-pressed="false">Questões e cobertura</button></nav>
<div class="controls"><input id="query" placeholder="Buscar no texto, título, artigo ou ID…" aria-label="Buscar"><select id="source" aria-label="Filtrar fonte"><option value="">Todas as fontes</option></select><select id="kind" aria-label="Filtrar tipo"><option value="">Todos os tipos</option><option>norma</option><option>precedente</option><option>doutrina</option></select></div>
<p id="count" class="muted" role="status"></p><section id="results"></section><div class="pagination"><button id="prev">Anterior</button><span id="page"></span><button id="next">Próxima</button></div><footer id="provenance"></footer></main>
<script>
const corpus=/*__CORPUS__*/null;
const el=id=>document.getElementById(id),norm=s=>String(s??'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sources=new Map(corpus.sources.map(s=>[s.id,s]));let view='chunks',page=0;const size=20;
el('identity').textContent=corpus.id+' · corte '+corpus.cutoff+' · capturas preservadas';
el('stats').innerHTML=[[corpus.questions.length,'questões no escopo'],[corpus.sources.filter(s=>s.chunks>0).length,'fontes com texto'],[corpus.chunks.length,'trechos pesquisáveis'],[corpus.questions.filter(q=>q.gaps.length).length,'questões com lacunas registradas']].map(([n,t])=>'<div><b>'+n+'</b>'+esc(t)+'</div>').join('');
for(const s of corpus.sources){const o=document.createElement('option');o.value=s.id;o.textContent=s.title+' ('+s.chunks+')';el('source').append(o)}
el('provenance').textContent='Banco: '+corpus.database+' | Manifesto SHA-256: '+corpus.hash+' | A busca desta tela filtra o conteúdo exportado; a recuperação dos agentes usa FTS5/BM25 no SQLite.';
const link=url=>/^https?:\/\//.test(url??'')?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Abrir fonte original ↗</a>':'';
function render(){const terms=norm(el('query').value).split(/\s+/).filter(Boolean),source=el('source').value,kind=el('kind').value;
 const rows=corpus[view].filter(r=>(!source||(view==='chunks'?r.sourceId===source:view==='sources'?r.id===source:r.sources.includes(source)))&&(!kind||(view==='questions'?r.sources.some(id=>sources.get(id)?.kind===kind):r.kind===kind))&&terms.every(t=>norm(view==='chunks'?[r.id,r.title,r.locator,r.text,r.sourceId].join(' '):view==='sources'?[r.id,r.title,r.kind,r.url,r.urn,r.query].join(' '):[r.id,r.topics,JSON.stringify(r.question),r.gaps.join(' ')].join(' ')).includes(t)));
 page=Math.min(page,Math.max(0,Math.ceil(rows.length/size)-1));el('count').textContent=rows.length+' registros encontrados';el('page').textContent=(page+1)+' / '+Math.max(1,Math.ceil(rows.length/size));el('prev').disabled=page===0;el('next').disabled=(page+1)*size>=rows.length;
 el('results').innerHTML=rows.slice(page*size,(page+1)*size).map(r=>view==='chunks'?'<article><div><span class="tag">'+esc(r.kind)+'</span><small>'+esc(r.id)+'</small></div><h2>'+esc(r.title)+'</h2><div class="source-title">'+esc(sources.get(r.sourceId)?.title)+' · '+esc(r.locator)+'</div><div class="text">'+esc(r.text)+'</div>'+link(r.url)+'<details><summary>Metadados e hash do trecho</summary><pre class="meta">'+esc(JSON.stringify({sourceId:r.sourceId,versionDate:r.versionDate,contentHash:r.contentHash,metadata:r.metadata},null,2))+'</pre></details></article>':view==='sources'?'<article><span class="tag">'+esc(r.kind)+'</span><h2>'+esc(r.title)+'</h2><p>'+r.chunks+' trechos · '+esc(r.id)+' · captura '+esc(r.status)+'</p>'+link(r.supplement?.url||r.url)+'<details><summary>Registro da fonte</summary><pre class="meta">'+esc(JSON.stringify(r,null,2))+'</pre></details></article>':'<article><h2>'+esc(r.id)+'</h2><p>'+esc(r.topics)+'</p><p>'+r.documentCount+' trechos nas fontes associadas ao escopo. Associação documental não é rótulo de avaliação.</p><p>'+r.sources.map(id=>'<span class="tag">'+esc(id)+'</span>').join(' ')+'</p><p>'+(r.gaps.length?'<strong>Lacunas:</strong> '+esc(r.gaps.join(' · ')):'Sem lacuna técnica registrada; suficiência temática ainda exige avaliação.')+'</p><details><summary>Questão original preparada e plano documental</summary><pre class="meta">'+esc(JSON.stringify({questao:r.question,artigos:r.articles,lacunas:r.gaps},null,2))+'</pre></details></article>').join('')||'<div class="empty">Nenhum registro. Tente outro termo ou remova os filtros.</div>';
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;page=0;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));['query','source','kind'].forEach(id=>el(id).addEventListener(id==='query'?'input':'change',()=>{page=0;render()}));el('prev').onclick=()=>{page--;render();window.scrollTo(0,180)};el('next').onclick=()=>{page++;render();window.scrollTo(0,180)};render();
</script></html>
